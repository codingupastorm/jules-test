<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Logic Tests</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #test-results { border: 1px solid #ccc; padding: 10px; margin-top: 20px; max-height: 500px; overflow-y: auto; }
        .test-result { margin-bottom: 5px; padding: 5px; border-radius: 3px; }
        .pass { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .fail { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .summary { margin-top: 10px; font-weight: bold; }
        #hidden-game-elements { display: none; } /* Hide actual game UI elements */
    </style>
</head>
<body>
    <h1>Game Logic Unit Tests</h1>
    <button id="run-tests-button">Run Tests</button>
    <div id="test-results"></div>

    <!-- Hidden div for game elements that script.js might need on load -->
    <div id="hidden-game-elements">
        <div id="game-container">
            <div id="game-info">
                Level: <span id="level-display">1</span>
                Target: <span id="target-display">0</span>
            </div>
            <div id="grid-container"></div>
            <div id="message-area"></div>
        </div>
    </div>

    <script src="script.js"></script> 
    <script src="tests.js"></script>
</body>
</html>
